    <style>
      :root{

        --good:#178a5b; --bad:#cf3f3f; --warn:#d9930d; --chip:#e3ebf3;
        --shadow:0 1px 3px rgba(16,42,67,.12),0 4px 14px rgba(16,42,67,.06);

      }
      *{box-sizing:border-box}

      .tab.on{color:var(--brand);border-bottom-color:var(--accent)}

      .tab .bdg{position:absolute;top:5px;right:2px;background:var(--accent);color:#fff;font-size:10px;

      h2.vt small{color:var(--muted);font-size:12.5px;font-weight:600}

      @media(max-width:520px){ .g2,.g3,.g4{grid-template-columns:1fr 1fr} .kpi-grid{grid-template-columns:1fr 1fr!important} }

      .btn{display:inline-block;border:1px solid var(--line);background:var(--surface2);color:var(--ink);

      .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}

    </style>
  </head>

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

}

/* ---------- 車両生成 ---------- */
var _carSeq = 1;
function genCar(modelIdx, opts){
  opts = opts || {};
  var m = MODELS[modelIdx];
  var curYear = 2026;
  var age = opts.age!=null ? opts.age : Math.round(clamp(rnd(1,13) + (m.rare>=4? rnd(0,5):0), 1, 18));
  var year = curYear - age;
  var km = opts.km!=null ? opts.km : Math.round(clamp(age * rnd(6000,13000) * rnd(0.5,1.25), 3000, 260000) / 100 * 100);
  var baseCond = clamp(88 - age*3.4 - km/9000 + rnd(-8,10), 25, 98);
  var car = {
    id: uid("car"), seq: _carSeq++, mi: modelIdx,
    mk: m.mk, nm: m.nm, cat: m.cat, body: m.body || m.cat, grade: pick(m.gr),
    year: year, km: km, color: pick(COLORS),
    equip: [], ext: Math.round(clamp(baseCond + rnd(-10,8), 15, 99)),
    int: Math.round(clamp(baseCond + rnd(-10,10), 15, 99)),
    mech: Math.round(clamp(baseCond + rnd(-12,6), 15, 99)),
    repair: Math.random() < clamp(0.06 + age*0.012, 0, 0.3),
    inspect: ri(0, 24), fuel: m.fuel, pop: m.pop, rare: m.rare, br: m.br,
    cost: 0, serviceCost: 0, askPrice: 0, days: 0, status: "stock",
    hidden: Math.random() < 0.16 ? rnd(0.3, 1) : 0,
    quality: 0.5, via: opts.via || "仕入", boughtDay: G ? G.day : 1,
    serviceQueue: []
  };
  var ne = ri(2,5), pool = EQUIP.slice();
  for (var i=0;i<ne;i++){ var j = Math.floor(Math.random()*pool.length); car.equip.push(pool.splice(j,1)[0]); }
  car.baseAtBuy = carValue(car, true);
  return car;
}
function modelByName(nm){ for (var i=0;i<MODELS.length;i++) if (MODELS[i].nm===nm) return i; return 0; }
function bodyOf(c){ if (!c) return ""; if (c.body) return c.body; var m = MODELS[c.mi]; return (m && m.body) || c.cat || ""; }
function fmtPrice(n){ // 整備費など小額は円単位まで正確に表示（万円丸めで同額に見える問題の対策）
  n = Math.round(n);
  if (Math.abs(n) < 100000) return n.toLocaleString("ja-JP") + "円";
  return man(n);
}

/* 個体の相場（円）。ignoreMarket=trueで市場指数を除く */
function carValue(car, ignoreMarket){
  var m = MODELS[car.mi];
  var age = 2026 - car.year;
  var ageF = Math.max(0.07, Math.pow(0.865, age));
  var mileF = clamp(1 - (car.km/10000) * 0.038, 0.42, 1.03);
  var condF = 0.72 + ((car.ext + car.int + car.mech)/3) / 100 * 0.42;
  var repF = car.repair ? 0.8 : 1.0;
  var inspF = 0.94 + clamp(car.inspect,0,24)/24 * 0.09;
  var popF = 0.88 + car.pop * 0.045 + car.rare * 0.02;
  var idx = ignoreMarket ? 1 : (G ? G.market[car.cat] : 1);
  var seas = ignoreMarket ? 1 : (G ? seasonFactor(car.cat) : 1);
  var v = m.np * 10000 * ageF * mileF * condF * repF * inspF * popF * idx * seas;
  return Math.max(20000, Math.round(v/1000)*1000);
}
function seasonFactor(cat){
  if (!G) return 1;
  var dt = new Date(2026,3,1); dt.setDate(dt.getDate()+G.day-1);
  var month = dt.getMonth()+1;
  var f = 1;
  if (month>=2 && month<=4) f += (cat==="軽自動車"||cat==="コンパクトカー"||cat==="ミニバン") ? 0.05 : 0.01;
  if (month>=11 || month===12) f += (cat==="SUV") ? 0.04 : 0;
  if (month>=6 && month<=8) f += (cat==="スポーツカー") ? 0.03 : 0;
  return f;
}

function faultRisk(car){
  var condBad = (100 - Math.min(car.mech, car.ext)) / 100;
  return clamp(0.03 + condBad*0.34 + car.hidden*0.3 + (2026-car.year)*0.006 - car.quality*0.05, 0.01, 0.75);
}
function suggestPrice(car){
  var v = carValue(car);
  var total = car.cost + car.serviceCost;
  return Math.max(Math.round(v*1.02/1000)*1000, Math.round(total*1.15/1000)*1000);
}
function stockCap(){
  if (!G) return 10;
  return 10 + (G.fac.lot||0)*8 + (G.fac.yard?6:0) + (G.fac.store2?15:0);
}
function netWorth(){ return G.cash + G.inventory.reduce(function(s,c){ return s + carValue(c)*0.92; },0) - G.loan; }
function rankName(nw){
  if (nw >= 100000000) return "中古車王";
  if (nw >= 60000000) return "中古車王への挑戦者";
  if (nw >= 30000000) return "県内有力店";

function careerFor(role, tier, years){
  var pool = (CAREERS[role] || CAREERS.sales).filter(function(c){ return c.tier === tier; });

  var c = pick(pool);
  return c.nm.replace("{years}", years);
}
function mkStaff(role, skill){
  var r = ROLES.filter(function(x){ return x.id===role; })[0];
  var roll = Math.random();
  var tier = skill != null ? (skill >= 65 ? 2 : skill >= 48 ? 1 : 0) : (roll < 0.3 ? 2 : roll < 0.72 ? 1 : 0);
  var sk = skill != null ? skill : (tier === 2 ? ri(64, 88) : tier === 1 ? ri(46, 68) : ri(28, 48));
  var years = tier === 2 ? ri(6, 18) : tier === 1 ? ri(2, 8) : ri(0, 1);
  var salMult = (tier === 2 ? rnd(1.12, 1.3) : tier === 1 ? rnd(0.95, 1.1) : rnd(0.78, 0.92));
  return { id: uid("st"), name: pick(STAFF_NAMES), role: role, skill: sk,
    salary: Math.round(r.base * salMult / 1000) * 1000, fatigue: ri(0, 20), years: years,
    career: careerFor(role, tier, years), tier: tier,
    tierLabel: tier === 2 ? "即戦力" : tier === 1 ? "経験者" : "未経験・伸びしろ",
    record: { sold: 0, serviced: 0, bought: 0 } };
}
function ensureCareers(){
  if (!G) return;
  var fix = function(s){
    if (!s.record) s.record = { sold: 0, serviced: 0, bought: 0 };
    if (s.career) return;
    var tier = s.skill >= 65 ? 2 : s.skill >= 48 ? 1 : 0;
    s.tier = tier; s.tierLabel = tier === 2 ? "即戦力" : tier === 1 ? "経験者" : "未経験・伸びしろ";
    if (!s.years) s.years = tier === 2 ? ri(6, 15) : tier === 1 ? ri(2, 7) : ri(0, 1);
    s.career = careerFor(s.role, tier, s.years);
  };
  (G.staff || []).forEach(fix);
  (G.candidates || []).forEach(fix);
}
function creditStaff(role, key){
  var list = G.staff.filter(function(s){ return s.role === role; });
  list.forEach(function(s){ if (s.tier < 2 && Math.random() < 0.25) s.skill = Math.min(92, s.skill + 1); });
  if (!list.length) return;
  var best = list.reduce(function(a, b){ return (b.skill > a.skill) ? b : a; });
  if (!best.record) best.record = { sold: 0, serviced: 0, bought: 0 };
  best.record[key]++;
}
function refreshCandidates(){
  if (!G) return;
  G.candidates = [];
  for (var i=0;i<4;i++){ G.candidates.push(mkStaff(pick(ROLES).id)); }

function staffSkill(role){
  var list = G.staff.filter(function(s){ return s.role===role; });
  if (!list.length) return 0;
  return Math.max.apply(null, list.map(function(s){ return s.skill; })) + (list.length-1)*4;
}
function monthlyFixed(){

function findCar(id){ for (var i=0;i<G.inventory.length;i++) if (G.inventory[i].id===id) return G.inventory[i]; return null; }
function buyCar(car, price, via, extraFee){
  if (G.inventory.length >= stockCap()){ toast("在庫上限（" + stockCap() + "台）に達しています。展示場拡張が必要です"); return false; }

  if (extraFee) addFin("transport", extraFee);

  car.askPrice = suggestPrice(car);
  G.inventory.push(car);
  G.stats.boughtCount++;
  G.tutorial.buy = true;
  checkAch();
  return true;
}

/* ---------- オークション ---------- */
function bidAuction(idx, bid){
  var lot = G.auction[idx];
  if (!lot || lot.done) return;
  if (G.inventory.length >= stockCap()){ toast("在庫上限に達しています"); return; }
  var appr = staffSkill("appr");
  var truePrice = lot.expected * rnd(0.96, 1.08) * (1 + lot.rivals * 0.02);
  var p = clamp(0.1 + (bid / truePrice - 0.78) * 2.2 + appr * 0.0015, 0.03, 0.95);
  lot.done = true;
  if (Math.random() < p){
    var fee = Math.round(bid * 0.03 / 1000) * 1000 + 15000; // 手数料3%＋輸送費
    var car = lot.car;
    if (buyCar(car, bid, "オークション", fee)){
      creditStaff("appr", "bought");
      G.stats.auctions++; unlock("auction1"); G.dealerTrust += 0;
      var msg = "🔨 落札！ " + car.mk + " " + car.nm + " を " + man(bid) + " で落札（手数料・陸送費 " + man(fee) + "）。";
      if (car.hidden > 0.55) msg += " ただし機関に気になる音がある…納車後チェックで不具合が見つかるかもしれない。";
      else if (car.hidden > 0) msg += " 大きな問題はなさそうだ。";
      toast("落札しました：" + car.nm);
      addNews("オークション落札", msg, "good");

    toast("落札できませんでした（競合の入札が上回りました）");

}

/* ---------- 整備 ---------- */
function jobCost(car, job, q){
  var mult = 1 + Math.max(0, (carValue(car, true) - 500000)) / 4000000; // 高額車は部品代増
  var base = job.cost * mult * q.cm * DIFFS[G.diff].costMult;
  if (G.fac.workshop) base *= 0.7;
  base *= 1 - Math.min(0.15, staffSkill("mech") * 0.0012);
  return Math.round(base / 100) * 100;
}
function orderService(carId, jobId, qIdx){
  var car = findCar(carId);
  if (!car || car.status !== "stock") return;
  var job = JOBS.filter(function(j){ return j.id===jobId; })[0];
  var q = QUALITY[qIdx];
  var cost = jobCost(car, job, q);
  if (G.cash < cost){ toast("資金不足で整備を発注できません"); return; }
  G.cash -= cost; addFin("service", cost);
  car.serviceCost += cost;
  car.status = "service";
  car.serviceQueue.push({ job: jobId, q: qIdx, left: Math.max(1, Math.round(job.days * (G.fac.workshop ? 0.8 : 1))), cost: cost });
  G.tutorial.service = true;
  toast("整備を発注：" + job.nm + "（" + man(cost) + "）");
  saveGame(); render();
}
function applyService(car, sq){
  var job = JOBS.filter(function(j){ return j.id===sq.job; })[0];
  var q = QUALITY[sq.q];
  var eff = q.em * (G.fac.workshop ? 1.12 : 1) * (1 + staffSkill("mech") * 0.002);
  for (var k in job.fix){
    car[k] = Math.round(clamp(car[k] + job.fix[k] * eff, 1, 99));
  }
  if (job.shaken) car.inspect = 24;
  if (sq.job === "engine" || sq.job === "oil" || sq.job === "brake") car.hidden = Math.max(0, car.hidden - 0.35 * eff);
  creditStaff("mech", "serviced");
  car.quality = clamp(car.quality + (sq.q === 2 ? 0.22 : sq.q === 1 ? 0.1 : 0.02), 0, 1.2);
  car.askPrice = Math.max(car.askPrice, suggestPrice(car));
  addNews("整備完了", car_.nameOf(car) + " の「" + job.nm + "」が完了。状態が改善した。", "good");
}

/* ---------- 来店客 ---------- */
function genVisitors(){
  var region = REGIONS[G.region], diff = DIFFS[G.diff], spec = SPECIALTIES[G.spec];
  var ad = AD_PLANS[G.adPlan];
  var base = 1.55 * region.dem * ad.mult * diff.demMult * (0.75 + G.rep/100) ;
  if (G.fac.showroom) base *= 1.15;
  if (G.fac.store2) base *= 1.3;
  if (G.buffs.visitorDays > 0) base *= G.buffs.visitorMult;
  var dow = (function(){ var dt=new Date(2026,3,1); dt.setDate(dt.getDate()+G.day-1); return dt.getDay(); })();
  if (dow === 0 || dow === 6) base *= 1.45;
  base *= G.economy;
  var n = Math.max(0, Math.round(base + rnd(-1, 1.4)));
  n = Math.min(n, 6);
  G.visitors = [];
  for (var i=0;i<n;i++){
    var t = pick(CUST_TYPES);
    var budget = Math.round(rnd(t.budget[0], t.budget[1]) * 10000 / 1000) * 1000;
    var wantCat = t.want ? pick(t.want) : null;
    if (spec.cat && Math.random() < 0.3) wantCat = pick(spec.cat);
    if (region.lux && Math.random() < 0.2) wantCat = pick(["高級車","輸入車"]);
    if (region.fam && Math.random() < 0.2) wantCat = pick(["ミニバン","SUV"]);
    G.visitors.push({
      id: uid("vis"), name: pick(CUST_NAMES) + "さん", type: t.nm, typeId: t.id,
      budget: budget, wantCat: wantCat, kmMax: t.kmMax, disc: t.disc, desc: t.desc,
      carId: null, patience: 1
    });
  }
  // 各来店客が最も興味を持つ在庫車を選ぶ
  G.visitors.forEach(function(v){
    var best = null, bs = -1;
    G.inventory.forEach(function(c){
      if (c.status !== "stock") return;
      var s = fitScore(v, c);
      if (s > bs){ bs = s; best = c; }
    });
    v.carId = best && bs > 18 ? best.id : null;
  });
}
function fitScore(v, car){
  var s = 26;
  if (v.wantCat && car.cat === v.wantCat) s += 26; else if (v.wantCat) s -= 8;
  if (car.askPrice <= v.budget) s += 16; else s -= clamp((car.askPrice - v.budget)/v.budget * 60, 0, 34);
  if (car.km <= v.kmMax) s += 10; else s -= 8;
  s += (car.ext + car.int + car.mech)/3 * 0.16;
  s += car.pop * 1.6 + car.rare * (v.typeId === "collector" ? 4 : 0.8);
  if (v.typeId === "eco") s += (car.fuel - 12) * 0.9;
  if (v.typeId === "sport") s += car.mech * 0.18;
  if (v.typeId === "lux") s += car.br * 3;
  var spec = SPECIALTIES[G.spec];
  if (spec.cat && spec.cat.indexOf(car.cat) >= 0) s += 6;
  return s;
}

/* ---------- 商談 ---------- */
function negoChance(v, car, price){
  var fit = fitScore(v, car);
  var val = carValue(car);
  var priceRatio = price / Math.max(val, 1);
  var p = fit * 0.8 - (priceRatio - 1) * 120 + (G.rep - 50) * 0.18 + staffSkill("sales") * 0.14 + (G.fac.lounge ? 6 : 0);
  if (price <= v.budget) p += 8; else p -= 14;
  return clamp(Math.round(p), 2, 96);
}
function resolveNego(vId, action){
  var v = null;
  G.visitors.forEach(function(x){ if (x.id === vId) v = x; });
  if (!v) return;
  var car = findCar(v.carId);
  if (!car){ toast("その車両はすでに売却済みです"); G.visitors = G.visitors.filter(function(x){ return x.id !== vId; }); render(); return; }
  var price = car.askPrice, extraRev = 0, extraCost = 0, tradeCar = null, label = "";
  if (action === "disc5"){ price = Math.round(price * 0.95 / 1000) * 1000; label = "5%値引き"; }
  if (action === "disc10"){ price = Math.round(price * 0.90 / 1000) * 1000; label = "10%値引き"; }
  if (action === "option"){ price += 60000; extraRev = 60000; extraCost = 24000; label = "オプション付帯（コーティング＋用品）"; }
  if (action === "tradein"){
    var mi = Math.floor(Math.random()*MODELS.length);
    tradeCar = genCar(mi, { via:"下取り" });
    var tv = Math.round(carValue(tradeCar, true) * rnd(0.8, 0.95) / 1000) * 1000;
    tradeCar._tradeValue = tv;
    price = car.askPrice; label = "下取り提案（下取り額 " + man(tv) + "）";
  }
  var p = negoChance(v, car, price) + (action === "disc5" ? 10 : action === "disc10" ? 20 : action === "tradein" ? 12 : action === "option" ? 5 : 0);
  p = clamp(p, 2, 97);
  var win = Math.random() * 100 < p;
  closeModal();
  if (win){
    var cashIn = price;
    if (tradeCar){
      cashIn = Math.max(0, price - tradeCar._tradeValue);
      tradeCar.cost = tradeCar._tradeValue; delete tradeCar._tradeValue;
      tradeCar.askPrice = suggestPrice(tradeCar); tradeCar.boughtDay = G.day;
      if (G.inventory.length < stockCap() + 1) G.inventory.push(tradeCar);
      G.stats.tradeins++; unlock("tradein1");
    }
    sellCar(car, cashIn, v, action);
    if (extraCost){ G.cash -= extraCost; addFin("service", extraCost); }
    G.stats.negoWin++; G.tutorial.sale = true;
    toast("🎉 成約！ " + car.nm + " を " + man(price) + " で販売" + (label ? "（" + label + "）" : ""));
  } else {
    G.stats.negoLose++;
    G.visitors = G.visitors.filter(function(x){ return x.id !== vId; });
    toast("商談はまとまりませんでした…（成約見込み " + p + "%）");

  }
  checkAch(); saveGame(); render();
}
function sellCar(car, cashIn, visitor, viaNego){
  G.cash += cashIn;
  var totalCost = car.cost + car.serviceCost;
  addFin("sales", cashIn + (viaNego === "option" ? 0 : 0)); addFin("cogs", totalCost);
  G.inventory = G.inventory.filter(function(c){ return c.id !== car.id; });
  G.visitors = G.visitors.filter(function(x){ return x.carId !== car.id; });
  G.stats.soldCount++;
  creditStaff("sales", "sold");
  var profit = cashIn - totalCost;
  var fair = clamp(1 - (cashIn / Math.max(carValue(car),1) - 1), 0.6, 1.15);
  var satis = Math.round(clamp(45 + fair * 30 + car.quality * 18 + rnd(-6, 8), 5, 100));
  G.customers.unshift({ name: visitor ? visitor.name : "ネット経由の購入者", car: car.mk + " " + car.nm, day: G.day, price: cashIn, satis: satis, claim: false });
  if (G.customers.length > 60) G.customers.length = 60;
  // 評判：適正価格・高品質はプラス、割高・低品質はマイナス
  var repDelta = (satis >= 70 ? 0.7 : satis <= 35 ? -2 : 0.1);
  G.rep = clamp(G.rep + repDelta, 1, 100);
  // クレーム予約：故障リスクに応じて数日〜数週間後に発生しうる
  var risk = faultRisk(car);
  if (Math.random() < risk){
    var sev = car.hidden > 0.4 ? rnd(0.5, 1) : rnd(0.15, 0.5);
    G.claims.push({ id: uid("cl"), carId: car.id, carName: car.mk + " " + car.nm, buyer: visitor ? visitor.name : "購入者",
      dueDay: G.day + ri(2, 20), cost: Math.round(cashIn * 0.06 * (1 + sev * 2.2) / 1000) * 1000, severity: sev, resolved: false });
  }
  if (car.rare >= 4) unlock("rare_sale");
  if (cashIn >= 5000000) unlock("lux_sale");
  addNews("成約", (visitor ? visitor.name + " に " : "") + car_.nameOf(car) + " を " + man(cashIn) + " で販売。粗利 " + (profit >= 0 ? "+" : "") + man(profit) + "。満足度 " + satis + "。", profit >= 0 ? "good" : "bad");
}

/* ---------- クレーム対応 ---------- */
function resolveClaim(id, mode){
  var cl = null;
  G.claims.forEach(function(c){ if (c.id === id) cl = c; });
  if (!cl || cl.resolved || !cl.active) return;
  cl.resolved = true;
  if (mode === "full"){
    G.cash -= cl.cost; addFin("warranty", cl.cost);
    G.rep = clamp(G.rep + 1.5, 1, 100);
    addNews("クレーム対応", cl.carName + " の不具合を無償修理（" + man(cl.cost) + "）。購入者からは丁寧な対応と感謝された。", "info");
    toast("無償修理で対応しました（評判アップ）");
  } else if (mode === "half"){
    var h = Math.round(cl.cost * 0.55 / 1000) * 1000;
    G.cash -= h; addFin("warranty", h);
    G.rep = clamp(G.rep - 1, 1, 100);
    addNews("クレーム対応", cl.carName + " の修理費を一部負担（" + man(h) + "）。購入者は渋々納得。", "info");
    toast("一部負担で対応しました");
  } else {
    G.rep = clamp(G.rep - 4.5, 1, 100);
    addNews("クレーム対応", cl.carName + " の不具合対応を断ったところ、口コミサイトに厳しい投稿が…評判が下がった。", "bad");
    toast("対応を断りました（評判ダウン）");
  }
  G.stats.claims++;
  saveGame(); render();
}

/* ---------- 借入 ---------- */
function loanLimit(){ return 10000000 + G.inventory.reduce(function(s,c){ return s + carValue(c); }, 0) * 0.3; }
function doLoan(amt){
  if (amt > 0){
    if (G.loan + amt > loanLimit()){ toast("借入限度額を超えています"); return; }
    G.loan += amt; G.cash += amt; toast(man(amt) + " を借り入れました");
  } else {
    var rep = Math.min(-amt, G.loan, G.cash);
    G.loan -= rep; G.cash -= rep; toast(man(rep) + " を返済しました");
  }
  saveGame(); render();
}

/* ---------- 1日進める ---------- */
function advanceDay(force){
  if (G.gameOver) return;
  if (!force && activeClaims().length){ openClaimConfirm(); return; }
  G.day++;
  var diff = DIFFS[G.diff];
  // 市場変動
  CATS.forEach(function(c){ G.market[c] = clamp(G.market[c] * rnd(0.994, 1.006), 0.7, 1.6); });
  G.fuel = clamp(G.fuel + ri(-2, 2), 130, 230);
  // 在庫経過
  G.inventory.forEach(function(c){ c.days++; if (c.inspect > 0 && G.day % 30 === 0) c.inspect--; });
  // 整備進行
  var stillWorking = [];
  G.inventory.forEach(function(c){
    if (c.status === "service" && c.serviceQueue.length){
      var sq = c.serviceQueue[0];
      sq.left--;
      if (sq.left <= 0){ applyService(c, sq); c.serviceQueue.shift(); }
      if (!c.serviceQueue.length) c.status = "stock";
    }
  });
  // 広告費・保管費（日次）
  var ad = AD_PLANS[G.adPlan];
  var adCost = Math.round(ad.cost * diff.costMult);
  if (adCost > 0){ G.cash -= adCost; addFin("ads", adCost); }
  var storage = G.inventory.length * (G.fac.yard ? 120 : 240);
  if (storage > 0){ G.cash -= storage; addFin("fees", storage); }
  // バフ減衰
  if (G.buffs.visitorDays > 0){ G.buffs.visitorDays--; if (G.buffs.visitorDays === 0) G.buffs.visitorMult = 1; }
  // 来店客
  genVisitors();
  // ネット経由の自動成約（割安な車が時々売れる）
  var autoSold = [];
  G.inventory.slice().forEach(function(c){
    if (c.status !== "stock" || !c.askPrice) return;
    var val = carValue(c);
    var ratio = c.askPrice / val;
    var p = ratio <= 0.92 ? 0.10 : ratio <= 1.0 ? 0.045 : ratio <= 1.08 ? 0.012 : 0.002;
    if (G.fac.studio) p *= 1.35;
    if (Math.random() < p) autoSold.push(c);
  });
  autoSold.slice(0, 2).forEach(function(c){
    sellCar(c, c.askPrice, null, "web");
    toast("ネット掲載から成約：" + c.nm + " " + man(c.askPrice));
  });
  // クレーム発動
  G.claims.forEach(function(cl){
    if (!cl.resolved && !cl.active && G.day >= cl.dueDay){
      cl.active = true;
      addNews("クレーム発生", cl.buyer + " から「" + cl.carName + " に不具合がある」と連絡。修理費の見込みは " + man(cl.cost) + "。ダッシュボードから対応を選ぼう。", "bad");
    }
  });
  // ランダムイベント
  if (Math.random() < 0.16) fireEvent();
  // 市場リフレッシュ（3日ごと）
  if (G.day % 3 === 0) refreshMarket(false);
  if (G.day % 7 === 0) refreshCandidates();
  // スタッフ疲労
  G.staff.forEach(function(s){ s.fatigue = clamp(s.fatigue + ri(-2, 4), 0, 100); });
  // 月次決算
  if (isMonthEnd(G.day - 1)) monthEnd();
  // 資金ショート警告
  if (G.cash < 0 && !G.gameOver){
    addNews("資金警告", "現金残高がマイナスになった。月末の固定費支払いで倒産する恐れがある。借入か在庫の現金化を急ごう。", "bad");
  }
  checkAch();
  saveGame(); render();
  if (G.monthReport){ openMonthReport(); }
}
function monthEnd(){
  var fixed = monthlyFixed();
  var interest = Math.round(G.loan * 0.006);
  G.cash -= fixed.total + interest;
  addFin("fixed", fixed.total); addFin("interest", interest);
  var f = G.fin;
  var gross = f.sales - f.cogs;
  var op = gross - f.service - f.ads - f.transport - f.warranty - f.fees - f.fixed - f.interest;
  G.monthHist.push({ label: monthLabel(G.day - 1), sales: f.sales, profit: op,
    br: { cogs: f.cogs, service: f.service, ads: f.ads, other: f.transport + f.warranty + f.fees, fixed: fixed.total, interest: interest } });
  if (G.monthHist.length > 24) G.monthHist.shift();
  G.monthReport = { label: monthLabel(G.day - 1), sales: f.sales, cogs: f.cogs, gross: gross, service: f.service, ads: f.ads, transport: f.transport, warranty: f.warranty, fees: f.fees, fixed: fixed, interest: interest, op: op, cash: G.cash };
  if (G.day >= 30 && !G.goal30done){
    G.goal30done = true;
    if (op > 0) addNews("目標達成", "最初の30日間を黒字で経営できた！この調子で規模拡大を目指そう。", "good");
    else addNews("目標未達", "最初の30日間は赤字着地。価格設定と仕入れ単価を見直そう。まだ取り返せる。", "bad");
  }
  G.fin = newFin();
  // 倒産判定：月末に現金が大きくマイナス
  if (G.cash < -300000){
    G.gameOver = true;
    addNews("倒産", "資金繰りが限界に達し、店舗を閉めることになった…。", "bad");
  }
}

function shade(hex, amt){
  var n = parseInt(hex.slice(1), 16);
  var r = Math.max(0, Math.min(255, (n>>16) + amt)), g = Math.max(0, Math.min(255, ((n>>8)&255) + amt)), b = Math.max(0, Math.min(255, (n&255) + amt));
  return "rgb(" + r + "," + g + "," + b + ")";
}
function wheelSVG(cx, big){
  var r = big ? 14.5 : 12.5, s = "";
  s += '<circle cx="' + cx + '" cy="92" r="' + (r+3.5) + '" fill="#10151b"/>';
  s += '<circle cx="' + cx + '" cy="92" r="' + r + '" fill="#1b2129"/>';
  s += '<circle cx="' + cx + '" cy="92" r="' + (r*0.58) + '" fill="#9aa7b5"/>';
  for (var i=0;i<5;i++){
    var a = i * 1.2566 + 0.5, x = cx + Math.cos(a)*r*0.36, y = 92 + Math.sin(a)*r*0.36;
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (r*0.17) + '" fill="#39434f"/>';
  }
  s += '<circle cx="' + cx + '" cy="92" r="' + (r*0.2) + '" fill="#d4dce4"/>';
  return s;
}
function carSVG(car){

  s += '<ellipse cx="120" cy="100" rx="112" ry="6" fill="rgba(0,0,0,.30)"/>';

  s += '<path d="' + art.d + '" fill="url(#' + gid + ')" stroke="rgba(10,16,22,.55)" stroke-width="1.4" stroke-linejoin="round"/>';

    s += '<line x1="' + mid + '" y1="' + (gy+2) + '" x2="' + mid + '" y2="' + gb + '" stroke="rgba(10,16,22,.6)" stroke-width="3"/>';
    // door lines & handles

    s += '<line x1="' + (gx2+3) + '" y1="' + gb + '" x2="' + (gx2+3) + '" y2="86" stroke="rgba(10,16,22,.35)" stroke-width="1.2"/>';
    s += '<rect x="' + (mid-14) + '" y="' + (gb+5) + '" width="10" height="2.6" rx="1.3" fill="rgba(10,16,22,.45)"/>';
    s += '<rect x="' + (mid+6) + '" y="' + (gb+5) + '" width="10" height="2.6" rx="1.3" fill="rgba(10,16,22,.45)"/>';

  if (f.indexOf(",open,")>=0){

    s += '<path d="M108 58 Q132 50 168 56" stroke="rgba(10,16,22,.4)" stroke-width="1.4" fill="none"/>';
  }
  if (f.indexOf(",scoop,")>=0) s += '<path d="M188 47 L206 48 L203 53 L190 53 Z" fill="rgba(8,12,16,.75)"/>';
  if (f.indexOf(",slide,")>=0) s += '<line x1="30" y1="58" x2="118" y2="58" stroke="rgba(10,16,22,.4)" stroke-width="1.6"/><line x1="118" y1="50" x2="118" y2="86" stroke="rgba(10,16,22,.35)" stroke-width="1.2"/>';
  if (f.indexOf(",van,")>=0) s += '<line x1="158" y1="30" x2="158" y2="86" stroke="rgba(10,16,22,.35)" stroke-width="1.2"/><rect x="164" y="54" width="11" height="2.6" rx="1.3" fill="rgba(10,16,22,.45)"/>';

  if (f.indexOf(",rails,")>=0 && art.g) s += '<line x1="' + (art.g[0]+8) + '" y1="' + (art.g[2]-3) + '" x2="' + (art.g[1]-8) + '" y2="' + (art.g[2]-3) + '" stroke="#141a21" stroke-width="2.6"/>';
  if (f.indexOf(",clad,")>=0) s += '<path d="M12 76 L230 76 L229 88 L13 88 Z" fill="rgba(12,17,23,.38)"/>';

  s += '</svg>';
  return s;
}

function condBar(lb, v){
  var col = v >= 70 ? "var(--good)" : v >= 45 ? "var(--warn)" : "var(--bad)";
  return '<div class="condbar"><span style="width:34px">' + lb + '</span><span class="bar"><i style="width:' + v + '%;background:' + col + '"></i></span><b class="num">' + v + '</b></div>';
}
function carCard(c, opts){
  opts = opts || {};
  var val = carValue(c);
  var total = c.cost + c.serviceCost;
  var margin = c.askPrice - total;
  var html = '<div class="card carcard">';
  html += '<div class="car-visual" style="background:linear-gradient(135deg,' + (CAT_COLOR[c.cat]||"#43617e") + ',#22303e)">' +
    '<div><div class="nm">' + esc(c.mk) + ' ' + esc(c.nm) + '</div><span class="cat">' + esc(bodyOf(c)) + '｜' + esc(c.grade) + '</span></div>' + carSVG(c) + '</div>';
  html += '<div class="spec"><span class="tag">' + esc(bodyOf(c)) + '</span><span>' + esc(c.cat) + '</span><span>' + c.year + '年式</span><span>' + kmf(c.km) + '</span><span>' + esc(c.color) + '</span><span>車検 ' + (c.inspect>0 ? "残" + c.inspect + "か月" : "切れ") + '</span>' +
    (c.repair ? '<span class="tag bad">修復歴あり</span>' : '<span class="tag good">修復歴なし</span>') +
    (c.rare >= 4 ? '<span class="tag warn">希少 ' + c.rare + '</span>' : '') +
    (c.status === "service" ? '<span class="tag warn">整備中</span>' : '') +
    (c.days >= 45 ? '<span class="tag bad">長期在庫 ' + c.days + '日</span>' : '') + '</div>';
  html += condBar("外装", c.ext) + condBar("内装", c.int) + condBar("機関", c.mech);
  html += '<div class="price-row"><span class="ask num">' + man(c.askPrice) + '</span>' +
    '<span class="small muted">相場 ' + man(val) + '｜原価計 ' + man(total) + '</span>' +
    '<span class="small ' + (margin >= 0 ? "pos" : "neg2") + '">見込粗利 ' + (margin>=0?"+":"") + man(margin) + '</span></div>';
  html += '<div class="row">' +
    '<button class="btn sm pri" data-act="car-detail" data-id="' + c.id + '">詳細・整備・価格</button>' +
    '<button class="btn sm" data-act="dealer-sell" data-id="' + c.id + '">業者売却 ' + man(Math.round(val*0.68/1000)*1000) + '</button>' +
    '<span class="sp"></span><span class="tiny muted">在庫' + c.days + '日</span></div>';
  html += '</div>';
  return html;
}

function kpi(lb, vl, sub){ return '<div class="card kpi"><div class="lb">' + lb + '</div><div class="vl num">' + vl + '</div><div class="sub">' + sub + '</div></div>'; }
function countThisMonth(){
  // sold リストではなく customers の当月分で概算（day から月を判定）
  var mk = monthKey(G.day);
  return G.customers.filter(function(c){ return monthKey(c.day) === mk; }).length;
}
function negoRate(){ var t = G.stats.negoWin + G.stats.negoLose; return t ? Math.round(G.stats.negoWin / t * 100) : 0; }
function avgDays(){ if (!G.inventory.length) return 0; return Math.round(G.inventory.reduce(function(s,c){ return s + c.days; },0) / G.inventory.length); }
function monthChart(){
  var rows = G.monthHist.slice(-7);
  var f = G.fin; var cur = (f.sales - f.cogs - f.service - f.ads - f.transport - f.warranty - f.fees);
  var data = rows.map(function(r){ return { l: r.label.replace(/^\d+年/,""), v: r.profit }; });
  data.push({ l: "当月", v: cur });
  var max = Math.max.apply(null, data.map(function(d){ return Math.abs(d.v); }).concat([100000]));
  var w = 300, hh = 96, bw = Math.floor(w / data.length) - 8;
  var svg = '<svg viewBox="0 0 ' + w + ' ' + (hh + 18) + '" style="width:100%;max-width:430px">';
  svg += '<line x1="0" y1="' + (hh/2) + '" x2="' + w + '" y2="' + (hh/2) + '" stroke="var(--line)"/>';
  data.forEach(function(d, i){
    var bh = Math.max(2, Math.abs(d.v) / max * (hh/2 - 4));
    var x = i * (bw + 8) + 4;
    var y = d.v >= 0 ? hh/2 - bh : hh/2;
    svg += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="2" fill="' + (d.v >= 0 ? "var(--good)" : "var(--bad)") + '"/>';
    svg += '<text x="' + (x + bw/2) + '" y="' + (hh + 13) + '" font-size="8.5" text-anchor="middle" fill="var(--muted)">' + d.l + '</text>';
  });
  return svg + '</svg>';
}

/* ---------- 財務 ---------- */
function finSeries(){
  var rows = (G.monthHist || []).slice(-11).map(function(r){
    var exp = r.sales - r.profit;
    return { l: r.label, sales: r.sales, exp: exp, profit: r.profit, br: r.br || null, partial: false };
  });
  var f = G.fin;
  var expNow = f.cogs + f.service + f.ads + f.transport + f.warranty + f.fees;
  rows.push({ l: "当月", sales: f.sales, exp: expNow, profit: f.sales - expNow,
    br: { cogs: f.cogs, service: f.service, ads: f.ads, other: f.transport + f.warranty + f.fees, fixed: 0, interest: 0 }, partial: true });
  return rows;
}
function pairedChart(rows, H){
  H = H || 170;
  var max = Math.max.apply(null, rows.map(function(r){ return Math.max(r.sales, r.exp); }).concat([100000]));
  var W = 660, base = H - 34, slot = W / rows.length, bw = Math.min(26, slot/2 - 5);
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%" role="img" aria-label="月別 収益と出費の棒グラフ">';
  svg += '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="var(--line)"/>';
  rows.forEach(function(r, i){
    var cx = i * slot + slot/2;
    var hs = Math.max(1, r.sales / max * (base - 22)), he = Math.max(1, r.exp / max * (base - 22));
    var brTip = r.br ? "｜内訳 原価" + man(r.br.cogs) + " 整備" + man(r.br.service) + " 広告" + man(r.br.ads) + " 家賃・給料等" + man(r.br.fixed + r.br.interest) + " その他" + man(r.br.other) : "";
    svg += '<g><title>' + esc(r.l) + "：売上 " + man(r.sales) + "／出費 " + man(r.exp) + "／営業利益 " + man(r.profit) + brTip + (r.partial ? "（当月・固定費未計上）" : "") + '</title>';
    svg += '<rect x="' + (cx - bw - 2) + '" y="' + (base - hs) + '" width="' + bw + '" height="' + hs + '" rx="2" fill="var(--good)"/>';
    svg += '<rect x="' + (cx + 2) + '" y="' + (base - he) + '" width="' + bw + '" height="' + he + '" rx="2" fill="#d97b2e"/>';
    svg += '</g>';
    svg += '<text x="' + cx + '" y="' + (base + 13) + '" font-size="9" text-anchor="middle" fill="var(--muted)">' + esc(r.l.replace(/^\d+年/,"")) + '</text>';
    svg += '<text x="' + cx + '" y="' + (base + 25) + '" font-size="9" font-weight="700" text-anchor="middle" fill="' + (r.profit >= 0 ? "var(--good)" : "var(--bad)") + '">' + (r.profit >= 0 ? "+" : "−") + man(Math.abs(r.profit)).replace("万円","") + '万</text>';
  });
  return svg + '</svg><div class="row small" style="gap:14px"><span><span style="color:var(--good)">■</span> 収益（売上）</span><span><span style="color:#d97b2e">■</span> 出費（費用合計）</span><span class="muted">下段の数字は営業利益（緑＝黒字／赤＝赤字）。棒に触れる／タップで金額詳細</span></div>';
}
var BR_SEG = [["cogs","仕入原価","#43617e"],["service","整備費","#2a9d8f"],["fixed","家賃・給料","#6d6fb8"],["interest","利息","#8a6d1f"],["ads","広告費","#d97b2e"],["other","その他費用","#9db0c3"]];
function stackChart(br){
  if (!br) return '<div class="small muted">内訳データは次回決算から記録されます。</div>';
  var total = BR_SEG.reduce(function(s, x){ return s + (br[x[0]] || 0); }, 0);
  if (total <= 0) return '<div class="small muted">この月の出費はありません。</div>';
  var x = 0, svg = '<svg viewBox="0 0 660 30" style="width:100%" role="img" aria-label="出費の内訳">';
  BR_SEG.forEach(function(seg){
    var v = br[seg[0]] || 0; if (!v) return;
    var w = Math.max(2, v / total * 660);
    svg += '<rect x="' + x + '" y="2" width="' + Math.min(w, 660 - x) + '" height="24" fill="' + seg[2] + '"><title>' + seg[1] + "：" + man(v) + '</title></rect>';
    x += w;
  });
  svg += '</svg><div class="row small" style="gap:12px;flex-wrap:wrap">' + BR_SEG.filter(function(seg){ return br[seg[0]]; }).map(function(seg){ return '<span><span style="color:' + seg[2] + '">■</span> ' + seg[1] + ' <b class="num">' + man(br[seg[0]]) + '</b></span>'; }).join("") + '</div>';
  return svg;
}

  h += '<div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 6px">📊 月別 収益 vs 出費（直近' + series.length + 'か月）</h3>' + pairedChart(series) +
    '<h3 style="margin:14px 0 6px">出費の内訳（' + (latestBr ? esc(latestBr.l) + (latestBr.partial ? "・固定費未計上" : "") : "") + '）</h3>' + (latestBr ? stackChart(latestBr.br) : "") + '</div>';
  h += '<div class="grid g2">' + block(G.fin, "今月（" + monthLabel(G.day) + "・固定費は月末計上）") + block(G.finTotal, "累計") + '</div>';
  h += '<div class="grid g2" style="margin-top:12px"><div class="card"><h3 style="margin:0 0 6px">貸借対照表（概算）</h3><table class="tbl">' +
    finRow("現金", G.cash) + finRow("在庫評価額", stockVal) + finRow("資産合計", G.cash + stockVal, true) +
    finRow("借入金", -G.loan) + finRow("純資産（総資産）", netWorth(), true) + '</table>' +
    '<div class="small muted">月末固定費の見込み：家賃 ' + man(monthlyFixed().rent) + '＋光熱費 ' + man(monthlyFixed().util) + '＋給料 ' + man(monthlyFixed().sal) + '＋利息 ' + man(Math.round(G.loan*0.006)) + '</div></div>';
  h += '<div class="card"><h3 style="margin:0 0 6px">月次推移</h3>' + (G.monthHist.length ? '<table class="tbl">' + G.monthHist.slice().reverse().map(function(r){ return '<tr><td>' + r.label + '</td><td class="r num">売上 ' + man(r.sales) + '</td><td class="r num"><span class="' + (r.profit<0?"neg2":"pos") + '">営業利益 ' + man(r.profit) + '</span></td></tr>'; }).join("") + '</table>' : '<div class="small muted">まだ月末決算がありません。日を進めて月を越えると決算が記録されます。</div>') + '</div></div>';
  h += '<h3 class="st">販売履歴（直近）</h3><div class="card scrollx"><table class="tbl"><tr><th>購入者</th><th>車両</th><th class="r">価格</th><th class="r">満足度</th></tr>' +
    (G.customers.slice(0, 15).map(function(c){ return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.car) + '</td><td class="r num">' + man(c.price) + '</td><td class="r">' + c.satis + '</td></tr>'; }).join("") || '<tr><td colspan="4" class="muted">まだ販売実績がありません</td></tr>') + '</table></div>';
  return h;
}

/* ---------- 相場 ---------- */
function viewMarket(){
  var h = '<h2 class="vt">市場相場 <small>カテゴリ別指数（100＝基準）と予測。予測は外れることもあります</small></h2>';
  h += '<div class="card"><div class="kv"><span>ガソリン価格</span><b class="num">' + G.fuel + '円/L</b></div><div class="kv"><span>景気指数</span><b>' + Math.round(G.economy * 100) + '</b></div>' +
    '<div class="kv"><span>季節要因</span><b>' + seasonNote() + '</b></div></div>';
  h += '<div class="card scrollx" style="margin-top:12px"><table class="tbl"><tr><th>カテゴリ</th><th class="r">現在指数</th><th class="r">来月の予測</th><th>自店在庫</th><th>見方</th></tr>' +
    CATS.map(function(c){
      var idx = G.market[c];
      var drift = (idx - 1) * 0.3 + rnd(-0.012, 0.018);
      var fc = clamp(idx * (1 + drift), 0.7, 1.6);
      var n = G.inventory.filter(function(x){ return x.cat === c; }).length;
      var arrow = idx >= 1.03 ? "📈 上昇基調" : idx <= 0.97 ? "📉 下落基調" : "➡️ 横ばい";
      return '<tr><td><b>' + c + '</b></td><td class="r num">' + Math.round(idx * 100) + '</td><td class="r num">' + Math.round(fc * 100) + ' 前後</td><td>' + n + '台</td><td class="small">' + arrow + (n && idx >= 1.03 ? "｜在庫あり：売り時" : n && idx <= 0.97 ? "｜在庫あり：値下げか長期戦" : "") + '</td></tr>';
    }).join("") + '</table></div>';
  h += '<div class="card small" style="margin-top:12px">相場は日々変動します。指数が高いカテゴリは高く売れますが、仕入れ価格も上がります。「安い時に仕入れて高い時に売る」が基本です。季節要因（新生活シーズンの軽・ミニバン、冬のSUV、夏のスポーツカー）も価格に反映されます。</div>';
  return h;
}
function seasonNote(){
  var dt = new Date(2026,3,1); dt.setDate(dt.getDate() + G.day - 1);
  var m = dt.getMonth() + 1;
  if (m >= 2 && m <= 4) return "新生活需要（軽・コンパクト・ミニバン＋）";
  if (m >= 11 || m === 12) return "冬のSUV需要＋";
  if (m >= 6 && m <= 8) return "夏のスポーツカー需要＋";
  return "特になし";
}

/* ---------- ニュース ---------- */
function viewNews(){
  var h = '<h2 class="vt">イベント・ニュース <small>経営の出来事と市場イベントの記録</small></h2><div class="card">';
  h += G.news.length ? G.news.map(newsItem).join("") : '<div class="muted small">まだニュースがありません</div>';
  return h + '</div>';
}

/* ---------- 実績・顧客 ---------- */
function viewAch(){
  var h = '<h2 class="vt">実績・統計 <small>解除 ' + Object.keys(G.ach).length + ' / ' + ACHIEVEMENTS.length + '</small></h2>';
  h += '<div class="grid g3">' + ACHIEVEMENTS.map(function(a){
    var got = G.ach[a.id];
    return '<div class="card ach"><div class="ic">' + (got ? a.ic : "🔒") + '</div><div><b>' + a.nm + '</b>' + (got ? ' <span class="tag good">' + dateStr(got) + ' 達成</span>' : '') + '<div class="small muted">' + a.desc + '</div></div></div>';
  }).join("") + '</div>';
  var s = G.stats;
  h += '<h3 class="st">経営統計</h3><div class="grid g4">' +
    kpi("累計販売台数", s.soldCount + "台", "") + kpi("累計仕入台数", s.boughtCount + "台", "") +
    kpi("商談成績", s.negoWin + "勝 " + s.negoLose + "敗", "成約率 " + negoRate() + "%") +
    kpi("クレーム対応", s.claims + "件", "買取 " + s.buybacks + "件／下取り " + s.tradeins + "件／落札 " + s.auctions + "件") + '</div>';
  h += '<h3 class="st">顧客リスト（購入者）</h3><div class="card scrollx"><table class="tbl"><tr><th>購入者</th><th>車両</th><th>購入日</th><th class="r">価格</th><th class="r">満足度</th></tr>' +
    (G.customers.map(function(c){ return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.car) + '</td><td>' + dateStr(c.day) + '</td><td class="r num">' + man(c.price) + '</td><td class="r">' + c.satis + (c.satis >= 75 ? ' <span class="tag good">リピート期待</span>' : '') + '</td></tr>'; }).join("") || '<tr><td colspan="5" class="muted">まだ顧客がいません</td></tr>') + '</table></div>';
  return h;
}

/* ---------- 設定・セーブ ---------- */
function viewSet(){
  var h = '<h2 class="vt">設定・セーブ管理</h2><div class="grid g2">' +
    '<div class="card"><h3 style="margin:0 0 8px">セーブ</h3>' +
    '<p class="small muted">進行状況は操作のたびにこの端末のブラウザへ自動保存されます（バージョン ' + SAVE_VER + '）。手動セーブも可能です。</p>' +
    '<div class="row"><button class="btn pri" data-act="save-now">今すぐセーブ</button><button class="btn" data-act="load-now">セーブを読み込む</button></div>' +
    '<p class="small" style="margin-top:10px">店舗名：' + esc(G.shopName) + '｜経営 ' + G.day + '日目｜難易度 ' + DIFFS[G.diff].nm + '｜地域 ' + REGIONS[G.region].nm + '｜方針 ' + SPECIALTIES[G.spec].nm + '</p></div>' +
    '<div class="card"><h3 style="margin:0 0 8px">データ管理</h3>' +
    '<p class="small muted">セーブを削除してタイトルに戻ります。削除したデータは復旧できません。</p>' +
    '<button class="btn dgr" data-act="wipe">セーブ削除してタイトルへ</button></div></div>' +
    '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px">遊び方ガイド</h3><div class="small">' +
    '<p><b>1. 仕入れ</b>：オークションは安いが不確定、買取は交渉次第、業者間は確実だが割高。相場より安く仕入れるのが利益の源泉です。</p>' +
    '<p><b>2. 商品化</b>：整備は費用がかかりますが、販売価格・成約率・顧客満足度が上がり、クレームが減ります。整備しすぎると赤字になる車もあります。</p>' +
    '<p><b>3. 価格設定</b>：相場の前後が基本。高すぎると在庫が滞留し保管費と値下がりで蝕まれます。</p>' +
    '<p><b>4. 商談</b>：顧客の予算と希望に合う車を提案。値引き・下取り・オプションの使い分けが腕の見せ所です。</p>' +
    '<p><b>5. 資金繰り</b>：月末に家賃・給料・利息が一括で引かれます。現金がマイナスで月を越えると倒産します。</p>' +
    '<p><b>6. 成長</b>：利益で設備投資（展示場・整備工場・第2店舗）と採用を進め、総資産1億円の「中古車王」を目指しましょう。</p></div></div>';
  return h;
}

/* ---------- モーダル ---------- */
function openModal(html){
  var m = document.getElementById("modal");
  m.innerHTML = '<div class="mbox-bg" data-act="close-modal"></div><div class="mbox">' + html + '</div>';
  m.classList.add("open");
}
function closeModal(){
  var m = document.getElementById("modal");
  m.classList.remove("open"); m.innerHTML = "";
}
var _confirmCb = null;
function confirmInPage(msg, cb){
  _confirmCb = cb;
  openModal('<h3>確認</h3><p>' + esc(msg) + '</p><div class="row"><button class="btn dgr" id="cf-yes">削除する</button><button class="btn" data-act="close-modal">キャンセル</button></div>');
  document.getElementById("cf-yes").addEventListener("click", function(){ closeModal(); if (_confirmCb) _confirmCb(); });
  return true;
}
function openMonthReport(){
  var r = G.monthReport; G.monthReport = null;
  var h = '<h3>📊 ' + r.label + ' 決算レポート</h3><table class="tbl">' +
    finRow("売上高", r.sales) + finRow("売上原価", -r.cogs) + finRow("売上総利益", r.gross, true) +
    finRow("整備費", -r.service) + finRow("広告費", -r.ads) + finRow("輸送・手数料・保管", -(r.transport + r.fees)) +
    finRow("保証修理費", -r.warranty) + finRow("家賃", -r.fixed.rent) + finRow("光熱費", -r.fixed.util) + finRow("給料", -r.fixed.sal) +
    finRow("利息", -r.interest) + finRow("営業利益", r.op, true) + '</table>' +
    '<p class="small">決算後の現金残高：<b class="num">' + man(r.cash) + '</b>' + (r.op >= 0 ? '｜黒字決算です。この調子で拡大を目指しましょう。' : '｜赤字決算。仕入れ単価・価格・固定費の見直しを。') + '</p>' +
    '<button class="btn pri" data-act="close-modal">確認した</button>';
  openModal(h);
  saveGame();
}

/* ---------- イベント委譲 ---------- */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
  if (act === "tab"){ UI.view = id; closeModal(); render(); window.scrollTo(0,0); }
  else if (act === "next-day"){ advanceDay(); }
  else if (act === "sort"){ UI.sortStock = id; render(); }
  else if (act === "car-detail"){ openCarDetail(id); }
  else if (act === "close-modal"){ closeModal(); }
  else if (act === "dealer-sell"){ closeModal(); doDealerSell(id); }
  else if (act === "bid"){ var inp = document.getElementById("bid-" + id); var v = inp ? Math.round(parseFloat(inp.value) * 10000) : 0; if (v > 0) bidAuction(parseInt(id,10), v); else toast("入札額を入力してください"); }
  else if (act === "buyback"){ var inp2 = document.getElementById("buy-" + id); var v2 = inp2 ? Math.round(parseFloat(inp2.value) * 10000) : 0; if (v2 > 0) doBuyback(parseInt(id,10), v2); else toast("提示額を入力してください"); }
  else if (act === "dealer-buy"){ doDealerBuy(parseInt(id,10)); }
  else if (act === "refresh-market"){ if (G.cash >= 10000){ G.cash -= 10000; addFin("fees", 10000); refreshMarket(false); saveGame(); render(); } else toast("資金不足です"); }
  else if (act === "service"){ orderService(id, b.getAttribute("data-job"), parseInt(b.getAttribute("data-q"),10)); var c = findCar(id); if (c) openCarDetail(id); }
  else if (act === "set-price"){ var pi = document.getElementById("price-in"); if (pi){ setPrice(id, parseFloat(pi.value) * 10000); openCarDetail(id); toast("販売価格を設定しました"); } }
  else if (act === "set-price-suggest"){ var cc = findCar(id); if (cc){ setPrice(id, suggestPrice(cc)); openCarDetail(id); } }
  else if (act === "nego-open"){ openNego(id); }
  else if (act === "nego-do"){ resolveNego(id, b.getAttribute("data-mode")); }
  else if (act === "nego-end"){ G.visitors = G.visitors.filter(function(x){ return x.id !== id; }); closeModal(); saveGame(); render(); }
  else if (act === "nego-assign"){ var sel = document.getElementById("nego-car"); if (sel){ G.visitors.forEach(function(x){ if (x.id === id) x.carId = sel.value; }); openNego(id); } }
  else if (act === "claim"){ resolveClaim(id, b.getAttribute("data-mode")); }
  else if (act === "claim-goto"){ gotoClaims(); }
  else if (act === "claim-proceed"){ closeModal(); advanceDay(true); }
  else if (act === "hire"){ hireStaff(id); }
  else if (act === "fire"){ fireStaff(id); }
  else if (act === "facility"){ buyFacility(id); }
  else if (act === "ad"){ setAdPlan(parseInt(id,10)); }
  else if (act === "loan"){ doLoan(parseInt(id,10)); }
  else if (act === "save-now"){ saveGame(); toast("セーブしました"); }
  else if (act === "load-now"){ var d = loadSave(); if (d){ G = d; UI.view = "dash"; render(); toast("読み込みました"); } else toast("読み込めるセーブがありません"); }
  else if (act === "wipe" || act === "restart"){ confirmInPage("セーブデータを削除してタイトルに戻りますか？", function(){ wipeSave(); G = null; UI.started = false; render(); }); }
});

/* ---------- 初期化 ---------- */
render();
</script>
